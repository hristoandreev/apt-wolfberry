name: Publish signed APT repo (multi-suite) from Actions artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"   # по желание

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    env:
      COMP: main
      ARCH: arm64

      # Репота, от които ще дърпаш artifacts (по един на ред)
      SOURCE_REPOS: |
        hristoandreev/gqrx
        hristoandreev/linux_wolfberry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl jq unzip gnupg dpkg-dev apt-utils

      - name: Download latest apt-* artifacts from repos
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          rm -rf incoming zips
          mkdir -p incoming zips

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: missing secret GH_TOKEN (needs Actions:Read for source repos)."
            exit 1
          fi

          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            echo "==> repo: $REPO"

            # Взимаме списък artifacts (до 100), филтрираме apt-*, не-expired,
            # сортираме по created_at desc и взимаме най-новия за всяко име.
            JSON="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100")"

            echo "$JSON" | jq -r '
              .artifacts
              | map(select(.expired==false))
              | map(select(.name | startswith("apt-")))
              | sort_by(.created_at) | reverse
              | unique_by(.name)
              | .[]
              | [.name, .archive_download_url]
              | @tsv
            ' | while IFS=$'\t' read -r ANAME ADL; do
                [ -z "$ANAME" ] && continue
                echo "  artifact: $ANAME"

                ZIP="zips/${REPO//\//_}__${ANAME}.zip"

                curl -fsSL -L \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "$ADL" -o "$ZIP"

                # Вътре очакваме директория bookworm/...deb или trixie/...deb
                unzip -o "$ZIP" -d incoming >/dev/null
              done

          done <<< "$SOURCE_REPOS"

          echo "Incoming content:"
          find incoming -maxdepth 3 -type f -name '*.deb' -print || true
          test -n "$(find incoming -type f -name '*.deb' -print -quit)" || (echo "ERROR: no .deb found in incoming/" && exit 1)

      - name: Import APT signing key (base64)
        env:
          APT_GPG_PRIVATE_KEY_B64: ${{ secrets.APT_GPG_PRIVATE_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          if [ -z "${APT_GPG_PRIVATE_KEY_B64:-}" ]; then
            echo "ERROR: missing secret APT_GPG_PRIVATE_KEY_B64"
            exit 1
          fi

          printf '%s' "$APT_GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          [ -n "$KEYID" ] || (echo "ERROR: No secret key imported" && exit 1)
          echo "SIGNING_KEYID=$KEYID" >> "$GITHUB_ENV"
          gpg --list-secret-keys --keyid-format=long

      - name: Build signed APT repo (dists/<suite>/main/binary-arm64/...) for Pages
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -e
          rm -rf public
          mkdir -p "public/pool/${COMP}"

          # Публикувай публичния ключ за клиентите (commit-нат в това repo)
          if [ -f repo-key.asc ]; then
            cp -v repo-key.asc public/repo-key.asc
          fi

          # Suites се определят от директориите в incoming/ (bookworm/, trixie/, ...)
          for suite_dir in incoming/*; do
            [ -d "$suite_dir" ] || continue
            SUITE="$(basename "$suite_dir")"

            echo "==> suite: $SUITE"
            mkdir -p "public/pool/${COMP}/${SUITE}"
            cp -v "$suite_dir"/*.deb "public/pool/${COMP}/${SUITE}/" || true

            mkdir -p "public/dists/${SUITE}/${COMP}/binary-${ARCH}"
          done

          cd public

          # За всяка suite: Packages + Release + подписи
          for SUITE_PATH in "pool/${COMP}/"*; do
            [ -d "$SUITE_PATH" ] || continue
            SUITE="$(basename "$SUITE_PATH")"

            echo "==> index/sign suite: $SUITE"

            dpkg-scanpackages -m "pool/${COMP}/${SUITE}" /dev/null > \
              "dists/${SUITE}/${COMP}/binary-${ARCH}/Packages"
            gzip -9fk "dists/${SUITE}/${COMP}/binary-${ARCH}/Packages"

            cat > apt-ftparchive.conf <<EOF
            APT::FTPArchive::Release::Origin "Wolfberry";
            APT::FTPArchive::Release::Label "Wolfberry APT";
            APT::FTPArchive::Release::Suite "${SUITE}";
            APT::FTPArchive::Release::Codename "${SUITE}";
            APT::FTPArchive::Release::Architectures "${ARCH}";
            APT::FTPArchive::Release::Components "${COMP}";
            APT::FTPArchive::Release::Description "Wolfberry aggregated APT repo";
            EOF

            apt-ftparchive -c apt-ftparchive.conf release "dists/${SUITE}" > "dists/${SUITE}/Release"

            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$APT_GPG_PASSPHRASE" \
              --default-key "$SIGNING_KEYID" \
              --digest-algo SHA256 \
              --clearsign -o "dists/${SUITE}/InRelease" "dists/${SUITE}/Release"

            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$APT_GPG_PASSPHRASE" \
              --default-key "$SIGNING_KEYID" \
              --digest-algo SHA256 \
              -abs -o "dists/${SUITE}/Release.gpg" "dists/${SUITE}/Release"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
